<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artistly — Prompt Library</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:         #F9F7FF;
    --surface:    #FFFFFF;
    --surface2:   #F2EFF9;
    --border:     #E2DCF0;
    --border2:    #C8BEDE;
    --text:       #1A1530;
    --text2:      #6B5F8A;
    --text3:      #A098B8;
    --sidebar:    #1E1535;
    --sidebar2:   #271A44;
    --purple:     #6B3FA0;
    --purple-lt:  #8B5FC0;
    --gold:       #D4A034;
    --gold-lt:    #E8BC58;
    --gold-bg:    #FBF5E6;
    --teal:       #2D8A7A;
    --teal-bg:    #E4F4F1;
    --red:        #8B2E2E;
    --red-bg:     #F5EAEA;
    --radius:     10px;
    --radius-sm:  6px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── SIDEBAR ── */
  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 270px; flex-shrink: 0;
    background: var(--sidebar);
    display: flex; flex-direction: column;
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 10;
    overflow: hidden;
  }
  .sidebar::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at top left, rgba(107,63,160,0.25) 0%, transparent 60%),
                radial-gradient(ellipse at bottom right, rgba(212,160,52,0.1) 0%, transparent 60%);
    pointer-events: none;
  }

  .sidebar-header {
    padding: 1.25rem 1.25rem 0.9rem;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    position: relative;
  }
  .brand-row { display: flex; align-items: center; gap: 10px; }
  .brand-icon {
    width: 36px; height: 36px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--purple) 0%, var(--gold) 100%);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: 0 2px 10px rgba(107,63,160,0.4);
  }
  .brand-name { font-size: 18px; font-weight: 800; color: #fff; letter-spacing: -0.02em; line-height: 1; }
  .brand-name span { color: var(--gold-lt); }
  .brand-sub { font-size: 9.5px; font-weight: 500; color: rgba(255,255,255,0.35); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 3px; }
  .library-label { font-size: 10px; color: rgba(255,255,255,0.28); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; margin-top: 8px; }

  .sidebar-search { padding: 0.9rem 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.07); position: relative; }
  .sidebar-search input {
    width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
    border-radius: var(--radius-sm); padding: 8px 12px 8px 32px;
    font-family: 'Inter', sans-serif; font-size: 13px; color: #fff; outline: none; transition: all 0.15s;
  }
  .sidebar-search input::placeholder { color: rgba(255,255,255,0.28); }
  .sidebar-search input:focus { border-color: var(--gold); background: rgba(255,255,255,0.12); }
  .search-icon { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); font-size: 13px; opacity: 0.35; pointer-events: none; }

  .sidebar-section { padding: 1rem 1.25rem 0.4rem; font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.28); font-weight: 600; }
  .cat-list { flex: 1; overflow-y: auto; padding-bottom: 1rem; }
  .cat-list::-webkit-scrollbar { width: 3px; }
  .cat-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }

  .cat-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 1.25rem; cursor: pointer; font-size: 13px;
    color: rgba(255,255,255,0.5); border-left: 3px solid transparent; transition: all 0.15s;
  }
  .cat-item:hover { color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.05); }
  .cat-item.active { color: #fff; font-weight: 600; border-left-color: var(--gold); background: rgba(255,255,255,0.08); }
  .cat-count { font-size: 10.5px; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.4); padding: 2px 7px; border-radius: 20px; min-width: 24px; text-align: center; font-weight: 500; }
  .cat-item.active .cat-count { background: var(--gold); color: #fff; }

  .sidebar-bottom { padding: 1rem 1.25rem 1.25rem; border-top: 1px solid rgba(255,255,255,0.08); }
  .add-btn-main {
    width: 100%;
    background: linear-gradient(135deg, var(--purple) 0%, var(--purple-lt) 100%);
    color: #fff; border: none; border-radius: var(--radius-sm); padding: 10px 0;
    font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 700;
    cursor: pointer; transition: opacity 0.15s;
    box-shadow: 0 2px 12px rgba(107,63,160,0.45);
  }
  .add-btn-main:hover { opacity: 0.9; }

  /* ── MAIN ── */
  .main { margin-left: 270px; flex: 1; }
  .topbar-accent { height: 3px; background: linear-gradient(90deg, var(--purple) 0%, var(--purple-lt) 40%, var(--gold) 70%, var(--gold-lt) 100%); }
  .topbar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 1.1rem 2rem; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 5;
  }
  .topbar-left h1 { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
  .topbar-left p { font-size: 12.5px; color: var(--text2); margin-top: 1px; }
  .topbar-right { display: flex; gap: 8px; align-items: center; }

  .sync-status { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text3); margin-right: 4px; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #ccc; }
  .sync-dot.ok { background: #4caf7d; }
  .sync-dot.err { background: #e05252; }
  .sync-dot.saving { background: var(--gold); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .view-toggle { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 2px; gap: 2px; }
  .view-btn { background: none; border: none; cursor: pointer; padding: 5px 10px; border-radius: 4px; font-size: 13px; color: var(--text2); font-family: 'Inter', sans-serif; transition: all 0.15s; }
  .view-btn.active { background: var(--sidebar); color: #fff; }

  .sort-select { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 10px; font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text); outline: none; cursor: pointer; }

  .content { padding: 1.5rem 2rem 3rem; }

  /* ── STATS ── */
  .stats-row { display: flex; gap: 10px; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .stat-pill { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; font-size: 12.5px; color: var(--text2); }
  .stat-pill strong { color: var(--text); font-weight: 700; }

  /* ── CARDS ── */
  .prompt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .prompt-list { display: flex; flex-direction: column; gap: 10px; }

  .prompt-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.2rem 1.3rem; transition: box-shadow 0.15s, border-color 0.15s; position: relative; overflow: hidden;
  }
  .prompt-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, var(--purple) 0%, var(--gold) 100%);
    opacity: 0; transition: opacity 0.15s;
  }
  .prompt-card:hover { border-color: var(--border2); box-shadow: 0 3px 16px rgba(107,63,160,0.1); }
  .prompt-card:hover::before { opacity: 1; }
  .prompt-card:hover .card-actions { opacity: 1; }

  .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .card-title { font-size: 14.5px; font-weight: 700; color: var(--text); line-height: 1.3; letter-spacing: -0.01em; }
  .card-actions { display: flex; gap: 5px; flex-shrink: 0; opacity: 0; transition: opacity 0.15s; }

  .act-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; padding: 3px 9px; font-size: 11.5px; font-family: 'Inter', sans-serif; cursor: pointer; color: var(--text2); transition: all 0.12s; white-space: nowrap; font-weight: 500; }
  .act-btn:hover { background: var(--sidebar); color: #fff; border-color: var(--sidebar); }
  .act-btn.copy-done { background: var(--teal); color: #fff; border-color: var(--teal); }
  .act-btn.del:hover { background: var(--red); color: #fff; border-color: var(--red); }

  .card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 9px; }
  .tag { font-size: 10.5px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
  .tag-cat { background: rgba(107,63,160,0.1); color: var(--purple); }
  .tag-gold { background: var(--gold-bg); color: #8B6010; border: 1px solid #E8D5A0; }
  .tag-teal { background: var(--teal-bg); color: var(--teal); }
  .tag-kw { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }

  .card-body { font-size: 12.5px; color: var(--text2); line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .card-body.clamped { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .expand-link { font-size: 11.5px; color: var(--purple); background: none; border: none; cursor: pointer; padding: 4px 0 0; font-family: 'Inter', sans-serif; font-weight: 600; }
  .expand-link:hover { color: var(--purple-lt); }

  .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .card-note { font-size: 11.5px; color: var(--text3); font-style: italic; flex: 1; line-height: 1.4; }
  .card-date { font-size: 10.5px; color: var(--text3); white-space: nowrap; margin-left: 8px; font-weight: 500; }

  /* ── EMPTY ── */
  .empty { text-align: center; padding: 5rem 2rem; }
  .empty-icon { font-size: 44px; margin-bottom: 1rem; opacity: 0.25; }
  .empty h3 { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .empty p { font-size: 13.5px; color: var(--text2); }

  /* ── MODAL ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(20,10,40,0.6); display: none; align-items: center; justify-content: center; z-index: 100; padding: 1rem; backdrop-filter: blur(3px); }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 14px; border: 1px solid var(--border); padding: 2rem; width: 100%; max-width: 580px; max-height: 90vh; overflow-y: auto; animation: slideUp 0.2s ease; }
  @keyframes slideUp { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-header { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; }
  .modal-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--purple), var(--gold)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 17px; }
  .modal-title { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 11px; font-weight: 700; color: var(--text2); margin-bottom: 5px; letter-spacing: 0.05em; text-transform: uppercase; }
  .field input, .field select, .field textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; font-family: 'Inter', sans-serif; font-size: 13.5px; color: var(--text); outline: none; transition: border-color 0.15s; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(107,63,160,0.08); }
  .field textarea { height: 190px; resize: vertical; line-height: 1.65; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); }
  .btn-cancel-modal { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 20px; font-family: 'Inter', sans-serif; font-size: 13.5px; color: var(--text2); cursor: pointer; font-weight: 500; }
  .btn-cancel-modal:hover { background: var(--surface2); }
  .btn-save-modal { background: linear-gradient(135deg, var(--purple) 0%, var(--purple-lt) 100%); color: #fff; border: none; border-radius: var(--radius-sm); padding: 9px 24px; font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 8px rgba(107,63,160,0.3); }
  .btn-save-modal:hover { opacity: 0.9; }

  /* ── CONFIRM ── */
  .confirm-overlay { position: fixed; inset: 0; background: rgba(20,10,40,0.6); display: none; align-items: center; justify-content: center; z-index: 200; padding: 1rem; }
  .confirm-overlay.open { display: flex; }
  .confirm-box { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 1.75rem 1.5rem; max-width: 340px; width: 100%; text-align: center; }
  .confirm-box h3 { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 7px; }
  .confirm-box p { font-size: 13px; color: var(--text2); margin-bottom: 1.25rem; }
  .confirm-btns { display: flex; gap: 8px; justify-content: center; }
  .btn-confirm-del { background: var(--red); color: #fff; border: none; border-radius: var(--radius-sm); padding: 9px 22px; font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .btn-confirm-cancel { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 22px; font-family: 'Inter', sans-serif; font-size: 13.5px; color: var(--text2); cursor: pointer; }

  /* ── TOAST ── */
  .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--sidebar); color: #fff; border-radius: var(--radius-sm); padding: 11px 18px; font-size: 13.5px; font-weight: 500; z-index: 300; transform: translateY(80px); opacity: 0; transition: all 0.25s ease; pointer-events: none; box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* ── LOADING ── */
  .loading-screen { position: fixed; inset: 0; background: var(--sidebar); display: flex; align-items: center; justify-content: center; z-index: 999; flex-direction: column; gap: 12px; }
  .loading-brand { font-size: 28px; font-weight: 800; color: #fff; letter-spacing: -0.03em; }
  .loading-brand span { color: var(--gold-lt); }
  .loading-sub { font-size: 11px; color: rgba(255,255,255,0.35); letter-spacing: 0.1em; text-transform: uppercase; }
  .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.12); border-top-color: var(--gold-lt); border-radius: 50%; animation: spin 0.8s linear infinite; margin-top: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── MOBILE RESPONSIVE ── */
  @media (max-width: 768px) {
    .sidebar {
      width: 100%;
      height: auto;
      position: relative;
      flex-direction: column;
    }
    .cat-list {
      max-height: 200px;
    }
    .layout {
      flex-direction: column;
    }
    .main {
      margin-left: 0;
    }
    .topbar {
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      padding: 1rem;
      position: relative;
    }
    .topbar-right {
      width: 100%;
      flex-wrap: wrap;
      gap: 6px;
    }
    .sort-select {
      flex: 1;
    }
    .content {
      padding: 1rem 1rem 3rem;
    }
    .prompt-grid {
      grid-template-columns: 1fr;
    }
    .stats-row {
      gap: 6px;
    }
    .card-actions {
      opacity: 1;
    }
    .modal {
      padding: 1.25rem;
      max-height: 95vh;
      border-radius: 14px 14px 0 0;
    }
    .modal-overlay {
      align-items: flex-end;
    }
    .field-row {
      grid-template-columns: 1fr;
    }
    .field textarea {
      height: 140px;
    }
    .sidebar-bottom {
      padding: 0.75rem 1.25rem;
    }
    .topbar-accent {
      display: none;
    }
  }

  @media (max-width: 480px) {
    .topbar-right {
      flex-direction: column;
    }
    .view-toggle, .sort-select {
      width: 100%;
    }
    .view-toggle {
      justify-content: center;
    }
    .view-btn {
      flex: 1;
      text-align: center;
    }
    .sync-status {
      margin-right: 0;
    }
    .stat-pill {
      font-size: 11.5px;
      padding: 4px 10px;
    }
    .toast {
      bottom: 1rem;
      right: 1rem;
      left: 1rem;
      text-align: center;
    }
  }

  .card-img { width: 100%; height: 160px; object-fit: contain; border-radius: 6px; background: #f5f3ff; margin-bottom: 10px; border: 0.5px solid var(--border); padding: 6px; }
  .prompt-list .card-img { height: 90px; width: 90px; float: left; margin: 0 12px 8px 0; }

</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-brand">Artist<span>ly</span></div>
  <div class="loading-sub">Prompt Library</div>
  <div class="spinner"></div>
</div>

<div class="layout" style="display:none" id="appLayout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand-row">
        <div class="brand-icon">🎨</div>
        <div>
          <div class="brand-name">Artist<span>ly</span></div>
          <div class="brand-sub">Artistly.ai Prompts</div>
        </div>
      </div>
      <div class="library-label">Prompt Library</div>
    </div>
    <div class="sidebar-search">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="Search prompts..." oninput="applyFilters()" />
    </div>
    <div class="sidebar-section">Categories</div>
    <div class="cat-list" id="catList"></div>
    <div class="sidebar-bottom">
      <button class="add-btn-main" onclick="openModal()">+ New Prompt</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar-accent"></div>
    <div class="topbar">
      <div class="topbar-left">
        <h1 id="pageTitle">All Prompts</h1>
        <p id="pageSubtitle"></p>
      </div>
      <div class="topbar-right">
        <div class="sync-status"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">Connecting...</span></div>
        <select class="sort-select" onchange="applyFilters()">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="alpha">A → Z</option>
        </select>
        <div class="view-toggle">
          <button class="view-btn active" id="vGrid" onclick="setView('grid')">⊞ Grid</button>
          <button class="view-btn" id="vList" onclick="setView('list')">☰ List</button>
        </div>
      </div>
    </div>
    <div class="content">
      <div class="stats-row" id="statsRow"></div>
      <div id="promptContainer"></div>
    </div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-icon">✨</div>
      <div class="modal-title" id="modalTitle">New Prompt</div>
    </div>
    <div class="field"><label>Prompt Title *</label><input type="text" id="fTitle" placeholder="e.g. Fairy mushroom cottage — watercolor style" /></div>
    <div class="field-row">
      <div class="field">
        <label>Category</label>
        <select id="fCat" onchange="toggleCustomCat()">
          <option>Clipart</option>
          <option>Floral & Nature</option>
          <option>Characters & People</option>
          <option>Animals & Creatures</option>
          <option>Fantasy & Whimsical</option>
          <option>Food & Objects</option>
          <option>Seasonal & Holiday</option>
          <option>General</option>
          <option>Custom...</option>
        </select>
      </div>
      <div class="field"><label>Tags (comma separated)</label><input type="text" id="fTags" placeholder="watercolor, whimsical, clipart" /></div>
    </div>
    <div class="field" id="customCatField" style="display:none"><label>Custom Category</label><input type="text" id="fCustomCat" /></div>
    <div class="field"><label>Prompt *</label><textarea id="fPrompt" placeholder="Paste your full image generation prompt here..."></textarea></div>
    <div class="field"><label>Notes / When to use</label><input type="text" id="fNotes" placeholder="e.g. Use whimsical fantasy style, great for Etsy clipart" /></div>
    <div class="modal-btns">
      <button class="btn-cancel-modal" onclick="closeModal()">Cancel</button>
      <button class="btn-save-modal" onclick="savePrompt()">Save Prompt</button>
    </div>
  </div>
</div>

<!-- CONFIRM -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3>Delete this prompt?</h3>
    <p>This action cannot be undone.</p>
    <div class="confirm-btns">
      <button class="btn-confirm-cancel" onclick="closeConfirm()">Cancel</button>
      <button class="btn-confirm-del" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(prompts)
    });
    if (!r.ok) throw new Error();
    setSyncStatus('ok');
    if (toast) showToast('Saved ✓');
  } catch(e) {
    setSyncStatus('err');
    if (toast) showToast('Save failed — check connection');
  }
}

function setSyncStatus(s) {
  document.getElementById('syncDot').className = 'sync-dot ' + s;
  document.getElementById('syncLabel').textContent = s==='ok'?'Synced':s==='saving'?'Saving...':'Offline';
}

const CATEGORIES = ['Clipart','Floral & Nature','Characters & People','Animals & Creatures','Fantasy & Whimsical','Food & Objects','Seasonal & Holiday','General'];
const TAG_CLASSES = ['tag-gold','tag-teal','tag-kw','tag-kw'];

async function fetchPrompts() {
  setSyncStatus('saving');
  try {
    const r = await fetch(BASE + '/latest', { headers: { 'X-Master-Key': API_KEY } });
    if (!r.ok) throw new Error();
    const data = await r.json();
    let rec = data.record;
    prompts = Array.isArray(rec) ? rec.filter(p => p && p.title) : [];
    if (prompts.length === 0) { prompts = SEED_PROMPTS; await pushPrompts(false); }
    setSyncStatus('ok');
  } catch(e) { setSyncStatus('err'); prompts = SEED_PROMPTS; }
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('appLayout').style.display = 'flex';
  render();
}

async function pushPrompts(toast = true) {
  setSyncStatus('saving');
  try {
    const r = await fetch(BASE, { method: 'PUT', headers: HEADERS, body: JSON.stringify(prompts) });
    if (!r.ok) throw new Error();
    setSyncStatus('ok');
    if (toast) showToast('Saved ✓');
  } catch(e) { setSyncStatus('err'); if (toast) showToast('Save failed — check connection'); }
}

function setSyncStatus(s) {
  document.getElementById('syncDot').className = 'sync-dot ' + s;
  document.getElementById('syncLabel').textContent = s==='ok'?'Synced':s==='saving'?'Saving...':'Offline';
}

function render() { renderSidebar(); renderMain(); }

function renderSidebar() {
  const cats = {};
  prompts.forEach(p => { if(p.category) cats[p.category] = (cats[p.category]||0)+1; });
  let html = `<div class="cat-item ${activeCategory==='all'?'active':''}" onclick="setCategory('all')">
    <span>All prompts</span><span class="cat-count">${prompts.length}</span></div>`;
  [...new Set([...CATEGORIES,...Object.keys(cats)])].forEach(cat => {
    if (!(cats[cat]||0)) return;
    const s = cat.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    html += `<div class="cat-item ${activeCategory===cat?'active':''}" onclick="setCategory('${s}')">
      <span>${esc(cat)}</span><span class="cat-count">${cats[cat]}</span></div>`;
  });
  document.getElementById('catList').innerHTML = html;
}

function renderMain() {
  const q = document.getElementById('search').value.toLowerCase();
  const sortVal = document.querySelector('.sort-select').value;
  let filtered = prompts.filter(p => {
    const inCat = activeCategory==='all' || p.category===activeCategory;
    const inQ = !q || [p.title,p.prompt,p.tags,p.notes].some(f=>(f||'').toLowerCase().includes(q));
    return inCat && inQ;
  });
  if (sortVal==='newest') filtered.sort((a,b)=>b.created-a.created);
  else if (sortVal==='oldest') filtered.sort((a,b)=>a.created-b.created);
  else filtered.sort((a,b)=>a.title.localeCompare(b.title));

  document.getElementById('pageTitle').textContent = activeCategory==='all'?'All Prompts':activeCategory;
  document.getElementById('pageSubtitle').textContent = `${filtered.length} prompt${filtered.length!==1?'s':''}${q?` matching "${q}"`:' in library'}`;

  const cats = [...new Set(prompts.map(p=>p.category).filter(Boolean))].length;
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-pill"><strong>${prompts.length}</strong> total prompts</div>
    <div class="stat-pill"><strong>${cats}</strong> categories</div>
    ${q?`<div class="stat-pill"><strong>${filtered.length}</strong> results</div>`:''}`;

  const container = document.getElementById('promptContainer');
  if (!filtered.length) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">🎨</div>
      <h3>${q||activeCategory!=='all'?'No prompts found':'Library is empty'}</h3>
      <p>${q||activeCategory!=='all'?'Try a different search or category.':'Click <strong>+ New Prompt</strong> to add your first prompt.'}</p></div>`;
    return;
  }
  container.className = currentView==='grid'?'prompt-grid':'prompt-list';
  container.innerHTML = filtered.map(p=>cardHTML(p)).join('');
}

function cardHTML(p) {
  const tags = (p.tags||'').split(',').map(t=>t.trim()).filter(Boolean);
  const date = new Date(p.created).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
  return `<div class="prompt-card">
    <div class="card-header">
      <div class="card-title">${esc(p.title)}</div>
      <div class="card-actions">
        <button class="act-btn" id="copy-${p.id}" onclick="copyPrompt('${p.id}')">Copy</button>
        <button class="act-btn" onclick="editPrompt('${p.id}')">Edit</button>
        <button class="act-btn del" onclick="askDelete('${p.id}')">Delete</button>
      </div>
    </div>
    ${p.img ? `<img src="${p.img}" class="card-img" alt="${esc(p.title)}" />` : ''}
    <div class="card-tags">
      <span class="tag tag-cat">${esc(p.category||'General')}</span>
      ${tags.map((t,i)=>`<span class="tag ${TAG_CLASSES[i%TAG_CLASSES.length]}">${esc(t)}</span>`).join('')}
    </div>
    <div class="card-body clamped" id="prev-${p.id}">${esc(p.prompt)}</div>
    <button class="expand-link" id="expbtn-${p.id}" onclick="toggleExpand('${p.id}')">Show full prompt ↓</button>
    <div class="card-footer">
      <div class="card-note">${p.notes?esc(p.notes):''}</div>
      <div class="card-date">${date}</div>
    </div>
  </div>`;
}

function toggleExpand(id) {
  const el=document.getElementById('prev-'+id), btn=document.getElementById('expbtn-'+id);
  btn.textContent = el.classList.toggle('clamped')?'Show full prompt ↓':'Collapse ↑';
}
function copyPrompt(id) {
  const p=prompts.find(x=>x.id===id); if(!p) return;
  navigator.clipboard.writeText(p.prompt).then(()=>{
    const btn=document.getElementById('copy-'+id);
    if(btn){btn.textContent='Copied!';btn.classList.add('copy-done');setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copy-done');},2000);}
    showToast('Prompt copied to clipboard');
  });
}
function setCategory(cat){activeCategory=cat;render();}
function setView(v){currentView=v;document.getElementById('vGrid').classList.toggle('active',v==='grid');document.getElementById('vList').classList.toggle('active',v==='list');renderMain();}
function applyFilters(){renderMain();renderSidebar();}

function openModal(id) {
  editId=id||null;
  ['fTitle','fPrompt','fTags','fNotes'].forEach(f=>document.getElementById(f).value='');
  document.getElementById('fCat').value='Clipart';
  document.getElementById('customCatField').style.display='none';
  if(id){
    const p=prompts.find(x=>x.id===id);
    document.getElementById('fTitle').value=p.title;
    document.getElementById('fPrompt').value=p.prompt;
    document.getElementById('fTags').value=p.tags||'';
    document.getElementById('fNotes').value=p.notes||'';
    const opts=Array.from(document.getElementById('fCat').options).map(o=>o.value);
    if(opts.includes(p.category)) document.getElementById('fCat').value=p.category;
    else{document.getElementById('fCat').value='Custom...';document.getElementById('customCatField').style.display='block';document.getElementById('fCustomCat').value=p.category;}
  }
  document.getElementById('modalTitle').textContent=id?'Edit Prompt':'New Prompt';
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('fTitle').focus(),100);
}
function editPrompt(id){openModal(id);}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');}
function toggleCustomCat(){document.getElementById('customCatField').style.display=document.getElementById('fCat').value==='Custom...'?'block':'none';}
function savePrompt() {
  const title=document.getElementById('fTitle').value.trim(), prompt=document.getElementById('fPrompt').value.trim();
  if(!title||!prompt){alert('Please fill in the title and prompt fields.');return;}
  let cat=document.getElementById('fCat').value;
  if(cat==='Custom...') cat=document.getElementById('fCustomCat').value.trim()||'General';
  const tags=document.getElementById('fTags').value.trim(), notes=document.getElementById('fNotes').value.trim();
  if(editId){const idx=prompts.findIndex(p=>p.id===editId);if(idx>-1)prompts[idx]={...prompts[idx],title,prompt,category:cat,tags,notes};}
  else prompts.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),title,prompt,category:cat,tags,notes,created:Date.now()});
  pushPrompts(); closeModal(); render();
}
function askDelete(id){deleteId=id;document.getElementById('confirmOverlay').classList.add('open');}
function closeConfirm(){document.getElementById('confirmOverlay').classList.remove('open');deleteId=null;}
function confirmDelete(){if(deleteId){prompts=prompts.filter(p=>p.id!==deleteId);pushPrompts();render();}closeConfirm();}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

fetchPrompts();
</script>
</body>
</html>
